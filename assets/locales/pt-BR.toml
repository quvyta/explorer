[explorer.cli]
help = """
qexp {version}: um explorador de arquivos para o terminal

Uso: qexp [PATH]

  PATH         uma pasta abre nela; um arquivo abre a pasta dele com o arquivo selecionado.
               Sem um caminho, o qexp abre a sua pasta pessoal.
  --version    mostra a versão
  --help       mostra esta ajuda

Uma vez por dia, ao iniciar, o qexp pergunta ao crates.io se há uma versão mais nova; desative isso nas configurações."""
missing = "qexp: não há nada em {path}"
unknown = "qexp: opção desconhecida {argument}; veja qexp --help"

