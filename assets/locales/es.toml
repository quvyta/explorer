[explorer.cli]
help = """
qexp {version}: un explorador de archivos para la terminal

Uso: qexp [RUTA]

  RUTA         una carpeta se abre ahí; un archivo abre su carpeta con el archivo seleccionado.
               Sin ruta, qexp abre tu carpeta personal.
  --version    muestra la versión
  --help       muestra esta ayuda

Una vez al día, al arrancar, qexp pregunta a crates.io si hay una versión más nueva; puedes desactivarlo en los ajustes."""
missing = "qexp: no hay nada en {path}"
unknown = "qexp: opción desconocida {argument}; consulta qexp --help"

