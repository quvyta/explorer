help = """
qexp {version}: terminal için bir dosya gezgini

Kullanım: qexp [YOL]

  YOL          bir klasörse orada açılır; bir dosyaysa klasöründe, dosya seçili açılır.
               Yol verilmezse qexp ev klasörünü açar.
  --version    sürümü yazar
  --help       bu yardımı yazar

qexp açılışta günde en fazla bir kez crates.io'ya yeni bir sürüm olup olmadığını sorar; ayarlardan kapatılabilir."""
