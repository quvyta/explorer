[explorer.cli]
help = """
qexp {version}: 端末用のファイルブラウザー

使い方: qexp [PATH]

  PATH         フォルダーならそこで開き、ファイルならそのフォルダーを選択状態で開きます。
               パスなしの場合はホームフォルダーを開きます。
  --version    バージョンを表示
  --help       このヘルプを表示

起動時に1日1回、crates.io に新しいバージョンがあるか照会します。設定で無効にできます。"""
missing = "qexp: {path} には何もありません"
unknown = "qexp: 不明なオプション {argument}。qexp --help を参照してください"

