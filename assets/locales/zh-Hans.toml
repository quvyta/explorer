[explorer.cli]
help = """
qexp {version}：终端文件管理器

用法：qexp [PATH]

  PATH         传入文件夹则在该处打开；传入文件则打开其所在文件夹并选中该文件。
               不带路径时 qexp 打开你的主文件夹。
  --version    打印版本
  --help       打印此帮助

qexp 每天启动时会询问 crates.io 是否有新版本；可在设置中关闭。"""
missing = "qexp：{path} 处没有任何内容"
