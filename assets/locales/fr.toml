[explorer.cli]
help = """
qexp {version} : un gestionnaire de fichiers pour le terminal

Utilisation : qexp [PATH]

  PATH         un dossier s'y ouvre ; un fichier ouvre son dossier avec le fichier sélectionné.
               Sans chemin, qexp ouvre votre dossier personnel.
  --version    affiche la version
  --help       affiche cette aide

Une fois par jour au démarrage, qexp interroge crates.io pour savoir si une version plus récente existe ; désactivez cela dans les paramètres."""
missing = "qexp : rien à l'emplacement {path}"
unknown = "qexp : option inconnue {argument} ; consultez qexp --help"

