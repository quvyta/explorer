[explorer.cli]
help = """
qexp {version}: файловый менеджер для терминала

Использование: qexp [PATH]

  PATH         если указана папка, открывается она; если файл — открывается его папка с выделенным файлом.
               Без пути qexp открывает вашу домашнюю папку.
  --version    вывести версию
  --help       вывести эту справку

Раз в день при запуске qexp запрашивает у crates.io, не вышла ли новая версия; отключите это в настройках."""
missing = "qexp: по пути {path} ничего нет"
unknown = "qexp: неизвестный параметр {argument}; см. qexp --help"

