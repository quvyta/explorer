[explorer.settings]
title = "Settings"
folders = "Folders"
view = "View"
hidden = "Show hidden files"
hidden-text = "Files and folders whose names start with a dot."
colour-icons = "Colour icons by kind"
colour-icons-text = "Each kind of file gets a colour of the theme. Needs a terminal with more than 16 colours; the shape of an icon always tells the kind."
not-saved = "The settings could not be saved"

[explorer.hints]
move = "move"
open = "open"
change = "change"
select = "select several"
menu = "actions"

[explorer.cli]
help = """
qexp {version}: a file explorer for the terminal

Usage: qexp [PATH]

  PATH         a folder opens there; a file opens its folder with the file selected.
               Without a path qexp opens your home folder.
  --version    print the version
  --help       print this help

Once a day at start qexp asks crates.io whether a newer version is out; turn it off in the settings."""
missing = "qexp: there is nothing at {path}"
unknown = "qexp: unknown option {argument}; see qexp --help"

