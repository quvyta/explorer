[explorer.wallpaper]
# The same words qdesk's own menu uses for it.
item = "Set as wallpaper"
running = "Setting {name} as the wallpaper"
done = "Wallpaper set"
# qdesk refused the picture; the body is qdesk's own reason.
refused = "{name} is not the wallpaper"
