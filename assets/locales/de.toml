[explorer.cli]
help = """
qexp {version}: ein Dateimanager fürs Terminal

Aufruf: qexp [PATH]

  PATH         ein Ordner öffnet dort; eine Datei öffnet ihren Ordner mit der Datei markiert.
               Ohne Pfad öffnet qexp deinen Home-Ordner.
  --version    gibt die Version aus
  --help       gibt diese Hilfe aus

Einmal am Tag fragt qexp beim Start crates.io, ob es eine neuere Version gibt; schalt das in den Einstellungen ab."""
missing = "qexp: unter {path} ist nichts"
unknown = "qexp: unbekannte Option {argument}; siehe qexp --help"

